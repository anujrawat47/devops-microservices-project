version: '3.8'

services:

  user-service:
    image: user-service:1.0
    container_name: user-service
    ports:
      - "8081:8081"
    restart: always
    healthcheck:
      test: ["CMD", "wget", "--spider", "http://localhost:8081/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 3
    environment:
      - PORT=8081

  order-service:
    image: order-service:1.0
    container_name: order-service
    ports:
      - "8082:8082"
    restart: always
    healthcheck:
      test: ["CMD", "wget", "--spider", "http://localhost:8082/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 3
    environment:
      - PORT=8082