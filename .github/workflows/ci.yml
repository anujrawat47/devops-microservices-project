name: DevOps CI Pipeline

on:
  push:
    branches:
      - main

jobs:

  build-and-push:
    runs-on: ubuntu-latest

    steps:

      # STEP 1: Get code
      - name: Checkout Code
        uses: actions/checkout@v4

      # STEP 2: Setup Java
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # STEP 3: Build project
      - name: Build with Maven
        run: mvn clean install -DskipTests

      # STEP 4: Docker Login
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # STEP 5: Build User Service Image
      - name: Build User Service Image
        run: |
          docker build -t ${{ secrets.DOCKER_USERNAME }}/user-service:latest \
          -f services/user-service/Dockerfile .

      # STEP 6: Push User Service Image
      - name: Push User Service Image
        run: |
          docker push ${{ secrets.DOCKER_USERNAME }}/user-service:latest

      # STEP 7: Build Order Service Image
      - name: Build Order Service Image
        run: |
          docker build -t ${{ secrets.DOCKER_USERNAME }}/order-service:latest \
          -f services/order-service/Dockerfile .

      # STEP 8: Push Order Service Image
      - name: Push Order Service Image
        run: |
          docker push ${{ secrets.DOCKER_USERNAME }}/order-service:latest